<div class="flex items-center justify-center w-full max-w-[1013px] mx-auto gap-[40px] overflow-x-auto scrollbar-none py-4 px-spacing-md" *transloco="let t">
  @for (step of steps; track step.id) {
    <div (click)="onStepSelect(step.id)"
         class="flex items-center min-w-max cursor-pointer group">

      <div [class]="currentStep() === step.id ? 'bg-[#537C0F]/20 ' : 'bg-transparent '"
           class="flex items-center justify-center h-[40px] px-[20px] py-[8px] rounded-[8px] border transition-all duration-300">

        <span [class]="currentStep() === step.id ? 'text-[#537C0F]' : 'text-black/60 group-hover:text-black'"
              class="text-base font-medium font-arabic whitespace-nowrap">
          {{ t(step.label) }}
        </span>

        @if (currentStep() > step.id) {
          <ng-icon name="lucideCheck" size="18" class="flex items-center text-[#537C0F] animate-fade-in"></ng-icon>
        }
      </div>
    </div>
  }
</div>
