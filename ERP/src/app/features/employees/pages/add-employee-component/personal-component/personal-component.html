<app-form-container-component *transloco="let t" [title]="t('EMPLOYEES.ADD_EMPLOYEE')" (submit)="onStepSubmit()">

  <ng-container formFields>
    <app-app-input-component [label]="t('EMPLOYEES.FULL_NAME_AR') + ' *'" [placeholder]="'EMPLOYEES.FULL_NAME_AR'"
      [control]="getControl('fullNameAr')" [showErrors]="submitted()">
    </app-app-input-component>

    <app-app-input-component [label]="'EMPLOYEES.FULL_NAME_EN'" [placeholder]="'EMPLOYEES.FULL_NAME_EN'"
      [control]="getControl('fullNameEn')" [showErrors]="submitted()">
    </app-app-input-component>

    <app-app-input-component [label]="'EMPLOYEES.NATIONAL_ID'" [control]="getControl('nationalId')"
      [showErrors]="submitted()">
    </app-app-input-component>

    <app-app-select-component [label]="t('EMPLOYEES.GENDER') + ' *'" [placeholder]="'PLACEHOLDER.SELECT_GENDER'"
      [control]="getControl('gender')" [showErrors]="submitted()">
      <option value="male">{{ t('EMPLOYEES.MALE') }}</option>
      <option value="female">{{ t('EMPLOYEES.FEMALE') }}</option>
    </app-app-select-component>

    <app-app-date-input-component [label]="'EMPLOYEES.BIRTH_DATE'" [control]="getControl('birthDate')"
      [showErrors]="submitted()" />

    <app-app-select-component [label]="t('EMPLOYEES.NATIONALITY') + ' *'"
      [placeholder]="'PLACEHOLDER.SELECT_NATIONALITY'" [control]="getControl('nationality')" [showErrors]="submitted()">

      @for (nation of nationalities(); track nation.code) {
      <option [value]="nation.code">
        {{ t('NATIONALITIES.' + nation.name) }}
      </option>
      }
    </app-app-select-component>

    <app-app-input-component [label]="'EMPLOYEES.EMAIL'" [control]="getControl('email')" [showErrors]="submitted()"
      [emailErrorKey]="'AUTH.INVALID_EMAIL_FORMAT'">
    </app-app-input-component>

    <app-app-input-component [label]="'EMPLOYEES.PHONE'" [control]="getControl('phone')" [showErrors]="submitted()">
    </app-app-input-component>

    <app-app-input-component [label]="'EMPLOYEES.ADDRESS'" [control]="getControl('address')" [showErrors]="submitted()">
    </app-app-input-component>

    <app-app-input-component [label]="'EMPLOYEES.EMERGENCY_CONTACT'" [control]="getControl('emergencyContact')"
      [showErrors]="submitted()">
    </app-app-input-component>

  </ng-container>

  <ng-container formActions>
    <button (click)="onStepSubmit()" type="button"
      class="h-[44px] px-[32px] bg-primary text-white rounded-[8px] font-bold hover:bg-primary-dark transition-all flex items-center gap-2">
      {{ t('COMMON.NEXT') }}
      <ng-icon [name]="t('DIRECTION') === 'rtl' ? 'lucideArrowLeft' : 'lucideArrowRight'" size="18" />
    </button>
  </ng-container>

</app-form-container-component>
