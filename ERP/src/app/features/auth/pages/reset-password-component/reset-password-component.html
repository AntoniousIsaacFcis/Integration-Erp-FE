<div class="flex flex-col w-[450px] gap-4 animate-fade-in" *transloco="let t">

  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <app-app-input-component [label]="'AUTH.PASSWORD_LABEL'" [placeholder]="'AUTH.PASSWORD_PLACEHOLDER'"
      [isPassword]="true" [control]="resetForm.controls.password" [showErrors]="submitted()">
    </app-app-input-component>

    <app-app-input-component [label]="'AUTH.CONFIRM_PASSWORD_LABEL'" [placeholder]="'AUTH.PASSWORD_PLACEHOLDER'"
      [isPassword]="true" [control]="resetForm.controls.confirmPassword" [showErrors]="submitted()">
    </app-app-input-component>

    @if (submitted() && resetForm.hasError('passwordMismatch')) {
    <app-submit-error-message-component [message]="t('AUTH.ERRORS.PASSWORD_MISMATCH')"></app-submit-error-message-component>
    }

    <app-app-btn-component [label]="isLoading() ? 'COMMON.LOADING' : 'AUTH.CONFIRM'" [disabled]="isLoading()"
      type="submit"
      class="mt-2 h-[48px] bg-[#85BB23] hover:bg-[#6EA30D] text-white rounded-lg transition-all shadow-md font-bold">
    </app-app-btn-component>
  </form>

  <app-auth-prompt-component
    message="AUTH.REMEMBER_PASSWORD"
    actionText="AUTH.LOGIN"
    route="/auth/login"
    linkColor="text-[#6FA40E]"
    class="mt-md">
  </app-auth-prompt-component>
</div>
