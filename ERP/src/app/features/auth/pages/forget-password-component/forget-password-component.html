<div class="flex flex-col w-[450px] gap-md animate-fade-in" *transloco="let t">

  @if (step() === 'email') {
  <form [formGroup]="forgetForm" (ngSubmit)="onSubmitEmail()" class="flex flex-col gap-md">
    <app-app-input-component [label]="'AUTH.EMAIL_LABEL'" [placeholder]="'AUTH.EMAIL_PLACEHOLDER'"
      [control]="forgetForm.controls.email" [showErrors]="submitted()">
    </app-app-input-component>

    <app-app-btn-component [label]="isLoading() ? 'AUTH.SENDING' : 'AUTH.SEND_RESET_LINK'" [disabled]="isLoading()"
      type="submit" class="mt-md text-black">
    </app-app-btn-component>
  </form>
  } @else {
  <div class="flex flex-col  animate-slide-in">
    <p class="text-sm font-arabic font-semibold text-[#222325] leading-[100%]">{{ t('AUTH.ENTER_CODE_SENT') }}</p>

    <div class="flex justify-start gap-[12px] ms-auto" dir="ltr">
      @for (i of [0, 1, 2, 3, 4]; track i) {
      <input #otpInput type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" (input)="onOtpInput($event, i)" (keydown.backspace)="onBackspace(i)" (paste)="onPaste($event)"
        class="w-[56.6px] h-[48px] font-['Manrope'] text-center text-[20px] text-[#222325] font-medium border-[1px] border-[#E2E2EA] rounded-lg focus:border-[#6FA40E] outline-none transition-all shadow-sm " />
      }
    </div>

    <div class="flex flex-row gap-4 items-center mt-xl">
      <app-app-btn-component class="w-[170px] h-[47px] flex items-center justify-center rounded-lg bg-[linear-gradient(90.62deg,_#85BB23_0%,_#6EA30D_100%)]
       border-[1.5px] border-white/10 text-white font-arabic font-semibold text-md leading-none active:scale-95 transition-all duration-200 opacity-100 disabled:opacity-50" label="AUTH.CONFIRM"></app-app-btn-component>

      <span class="font-['Manrope'] font-normal text-[14px] leading-[100%] tracking-[2%] text-[#222325]">
        Resend code in <span class="text-[#78AA1D]">59:00</span>
      </span>
    </div>

  </div>
  }

  <app-auth-prompt-component message="AUTH.REMEMBER_PASSWORD" actionText="AUTH.LOGIN" route="/auth/login"
    linkColor="text-[#6FA40E]" class="me-[100px] mt-md">
  </app-auth-prompt-component>
</div>
