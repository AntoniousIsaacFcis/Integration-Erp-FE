<div class="w-full border border-black/5 rounded-xl overflow-hidden bg-white shadow-soft py-3 px-8" *transloco="let t">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr >
            <th class="p-4 text-base font-normal text-black">{{t('SHIFT.DAY')}}</th>
            <th class="ps-20 text-base font-normal text-black">{{t('SHIFT.WORK_DAY')}}</th>
            <th class="ps-17 text-base font-normal text-black">{{t('SHIFT.CALCULTING_ATTENDACE_IN_HOLIDAY')}}</th>
            @if (allowLateToleranceOverrides()) {
            <th class="ps-8 text-base font-normal text-black">{{t('SHIFT.LATE_TOLERANCE_MINUTES')}}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (day of gridData(); track day.day; let i = $index) {
            <tr class=" hover:bg-gray-50/30 transition-colors">
              <td class="px-4 py-1 text-sm font-medium text-[#C3C3C3]">{{ day.label }}</td>
              <td class="ps-20">
                <input type="checkbox"
                       [checked]="day.isWorkDay"
                       (change)="toggle(i, 'isWorkDay')"
                       class="w-5 h-5 cursor-pointer rounded-[6px] border-[#C3C3C3] accent-[#C3C3C3] focus:ring-primary/20">
              </td>
              <td class="ps-17 py-1">
                <input type="checkbox"
                       [checked]="day.calculateOnHoliday"
                       (change)="toggle(i, 'calculateOnHoliday')"
                       class="w-5 h-5 rounded-[6px] border-black/10 text-primary focus:ring-primary/20 cursor-pointer">
              </td>
              @if (allowLateToleranceOverrides()) {
              <td class="ps-8 py-1">
                <input type="number"
                       min="0"
                       [value]="day.lateToleranceMinutes ?? ''"
                       (input)="updateLateTolerance(i, $any($event.target).value)"
                       class="w-24 h-9 rounded-md border border-black/10 px-3 text-sm text-black outline-none focus:border-primary/60"
                       [placeholder]="t('COMMON.DEFAULT')">
              </td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
