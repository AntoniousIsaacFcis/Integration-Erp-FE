<main class="flex justify-center" *transloco="let t">
  <div class="w-full max-w-standard bg-white rounded-[20px] shadow-soft border border-black/5">
    <app-form-container-component [title]="t('MENU.CREATE_LEAVE_APPLICATION')" (submit)="onSave()">
      <ng-container formFields>
        <app-attendance-employee-lookup-component
          [(selectedEmployee)]="selectedEmployee"
          [label]="'ATTENDANCE.EMPLOYEE_NAME'"
          [placeholder]="'ATTENDANCE.EMPLOYEE_SEARCH_PLACEHOLDER'" />

        <app-app-select-component [label]="t('EMPLOYEES.VACATIONS.APPLICATION_TYPE') + ' *'"
          [control]="getControl('type')" [showErrors]="submitted()"
          [placeholder]="'EMPLOYEES.VACATIONS.SELECT_APPLICATION_TYPE'">
          @for (option of leaveTypeOptions; track option.value) {
          <option [value]="option.value">{{ t(option.label) }}</option>
          }
        </app-app-select-component>

        <app-app-select-component [label]="t('EMPLOYEES.VACATIONS.VACATION_TYPE') + ' *'"
          [control]="getControl('leaveTypeId')" [showErrors]="submitted()"
          [placeholder]="'EMPLOYEES.VACATIONS.SELECT_VACATION_TYPE'">
          @for (leaveType of leaveTypesResource.value() ?? []; track leaveType.id) {
          <option [value]="leaveType.id">{{ leaveType.name }}</option>
          }
        </app-app-select-component>

        <app-app-date-input-component [label]="t(isHalfLeave() ? 'COMMON.DATE' : 'EMPLOYEES.VACATIONS.VACATION_START_Date') + ' *'"
          [control]="getControl('fromDate')" [showErrors]="submitted()"
          [pastDateErrorKey]="'ERRORS.DATE_CANNOT_BE_IN_PAST'" />

        @if (!isHalfLeave()) {
        <app-app-date-input-component [label]="t('EMPLOYEES.VACATIONS.VACATION_END_DATE') + ' *'"
          [control]="getControl('toDate')" [showErrors]="submitted()"
          [dateRangeErrorKey]="'ERRORS.END_DATE_MUST_BE_ON_OR_AFTER_START_DATE'" />
        }

        <app-app-input-component [label]="t('EMPLOYEES.VACATIONS.DAYS') + ' *'"
          [placeholder]="t('EMPLOYEES.VACATIONS.DAYS')" [control]="getControl('days')"
          [showErrors]="submitted()" type="number" />

        <app-app-textarea-component [label]="t('COMMON.DESCRIPTION')" [control]="getControl('description')"
          [placeholder]="t('PLACEHOLDER.ENTER_NOTES')" [showErrors]="submitted()" />
      </ng-container>

      <ng-container formActions>
        <app-form-cancel-button-component (clicked)="onCancel()" />
        <app-form-save-button-component [isLoading]="isSaving()" [label]="'COMMON.SAVE'" type="submit" />
      </ng-container>
    </app-form-container-component>
  </div>
</main>
