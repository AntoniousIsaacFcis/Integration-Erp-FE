<main class="flex justify-center" *transloco="let t">
  @if (isFormReady()) {
  <div class="w-full max-w-standard bg-white rounded-[20px] shadow-soft border border-black/5 flex flex-col mx-auto">
    <app-form-container-component [title]="t('MENU.VIEW_ATTENDANCE_DAY_DETAILS')">
      <ng-container formFields>
        <section class="col-span-full">
          <h3 class="text-base font-medium mb-4 text-black">{{ t('ATTENDANCE.ATTENDANCE_INFO') }}</h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
            <app-app-input-component
              [label]="t('ATTENDANCE.EMPLOYEE_NAME') + ' *'"
              [control]="getControl('employeeName')"
              [placeholder]="'PLACEHOLDER.EMPLOYEE_NAME'" />

            <app-app-date-input-component
              [label]="t('ATTENDANCE.ATTENDANCE_DATE') + ' *'"
              [control]="getControl('date')" />
          </div>
        </section>

        <section class="col-span-full border-t border-black/10 pt-6">
          <app-app-radio-component
            [label]="'ATTENDANCE.STATUS_LABEL'"
            [required]="true"
            [control]="getControl('status')"
            [options]="statusOptions" />
        </section>

        @if (isLeave()) {
        <section class="col-span-full border-t border-black/10 pt-6">
          <app-app-select-component
            [label]="t('LABEL.LEAVE_TYPE') + ' *'"
            [control]="getControl('leaveTypeId')"
            [placeholder]="'PLACEHOLDER.SELECT_LEAVE_TYPE'">
            @for (leaveType of leaveTypeOptions(); track leaveType.id) {
            <option [value]="leaveType.id">{{ leaveType.name }}</option>
            }
          </app-app-select-component>
        </section>
        }

        @if (isPresent()) {
        <section class="col-span-full border-t border-black/10 pt-6">
          <h3 class="text-base font-medium mb-4 text-black">{{ t('ATTENDANCE.ATTENDANCE_TIMES') }}</h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
            <app-time-input-component
              [label]="t('ATTENDANCE.SHIFT_START')"
              [control]="getControl('shiftStart')" />

            <app-time-input-component
              [label]="t('ATTENDANCE.SHIFT_END')"
              [control]="getControl('shiftEnd')" />

            <app-time-input-component
              [label]="t('ATTENDANCE.CHECK_IN_TIME')"
              [control]="getControl('checkIn')" />

            <app-time-input-component
              [label]="t('ATTENDANCE.CHECK_OUT_TIME')"
              [control]="getControl('checkOut')" />
          </div>
        </section>
        }

        <section class="col-span-full border-t border-black/10 pt-6">
          <app-app-textarea-component
            [label]="t('LABEL.NOTES')"
            [control]="getControl('notes')"
            [placeholder]="t('PLACEHOLDER.ENTER_NOTES')" />
        </section>
      </ng-container>

      <ng-container formActions>
        <app-form-save-button-component [label]="'COMMON.BACK'" (clicked)="onBack()" />
      </ng-container>
    </app-form-container-component>
  </div>
  }
</main>
