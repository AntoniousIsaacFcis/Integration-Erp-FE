<main class="flex justify-center" *transloco="let t">
  @if (isFormReady()) {
  <div class="w-full max-w-standard bg-white rounded-[20px] shadow-soft border border-black/5 flex flex-col mx-auto">

    <app-form-container-component [title]="t('MENU.VIEW_ATTENDANCE_LOG_DETAILS')">
      <ng-container formFields>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6 col-span-full">
          <app-app-input-component [label]="t('ATTENDANCE.TABLE_EMPLOYEE_NAME')"
            [control]="detailsForm.controls.employeeName" />

          <app-app-date-input-component [label]="t('ATTENDANCE.CREATE_DATE')" [control]="detailsForm.controls.date" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6 col-span-full mt-6">
          <app-time-input-component [label]="t('ATTENDANCE.CHECK_IN_TIME')" [control]="detailsForm.controls.checkIn" />

          <app-app-input-component [label]="t('ATTENDANCE.SOURCE')" [control]="detailsForm.controls.source" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6 col-span-full mt-6">
          <app-app-input-component [label]="t('ATTENDANCE.SESSION_NUMBER')"
            [control]="detailsForm.controls.sessionNumber" />

          <div class="col-span-1 flex flex-col gap-2">
            <label class="text-base font-medium text-black">{{ t('ATTENDANCE.STATUS_LABEL') }} </label>
            <div class="flex items-center gap-6 h-[44px]">
              <label class="flex items-center gap-2">
                <input type="radio" value="present" [formControl]="detailsForm.controls.status"
                  class="accent-primary pointer-events-none">
                <span class="text-sm">{{ t('ATTENDANCE.STATUS.PRESENT') }}</span>
              </label>
              <label class="flex items-center gap-2">
                <input type="radio" value="absent" [formControl]="detailsForm.controls.status"
                  class="accent-primary pointer-events-none">
                <span class="text-sm">{{ t('ATTENDANCE.STATUS.ABSENT') }}</span>
              </label>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-container formActions>
        <app-form-save-button-component [label]="'COMMON.BACK'" (clicked)="onBack()" />
      </ng-container>

    </app-form-container-component>
  </div>
}
</main>
