<div
  class="w-full max-w-standard bg-white rounded-[20px] shadow-soft border border-black/5 p-spacing-xl flex flex-col gap-spacing-lg mx-auto">
  <app-form-container-component *transloco="let t" [title]="t('ORGANIZATION.ADD_DEPARTMENT')" (submit)="onSubmit()">
    <ng-container formFields [formGroup]="departmentForm">
      <div>
        <app-app-input-component [label]="t('ORGANIZATION.DEPARTMENT_NAME') + ' *'"
          [placeholder]="t('PLACEHOLDER.ENTER_NAME')" [control]="departmentForm.controls.name"
          [showErrors]="isFormSubmitted()" [minLengthErrorKey]="'ERRORS.DEPARTMENT_NAME_MIN_LENGTH'"
          [maxLengthErrorKey]="'ERRORS.DEPARTMENT_NAME_MAX_LENGTH'" />
      </div>

      <app-app-input-component [label]="t('ORGANIZATION.DEPARTMENT_ABBREVIATION')"
        [placeholder]="t('PLACEHOLDER.ENTER_CODE')" [control]="departmentForm.controls.abbreviation"
        [showErrors]="isFormSubmitted()" />

      <app-app-radio-component [label]="t('COMMON.STATUS')" [required]="true"
        [control]="departmentForm.controls.status" [options]="[
          { label: 'COMMON.ACTIVE', value: 'active' },
          { label: 'COMMON.INACTIVE', value: 'inactive' }
        ]" />
        
      <app-department-staff-selector-component [label]="'ORGANIZATION.RESPONSIBLE_MANAGERS'"
        [selectedIds]="managerStaffIds()" [staffOptions]="staffOptions()" [isLoading]="isLoadingStaff()"
        (selectedIdsChange)="onManagersChange($event)" />


      <div class="col-span-2">
        <app-department-staff-selector-component [label]="'ORGANIZATION.EMPLOYEES_IN_DEPARTMENT'"
          [selectedIds]="employeeStaffIds()" [staffOptions]="staffOptions()" [isLoading]="isLoadingStaff()"
          (selectedIdsChange)="onEmployeesChange($event)" />
      </div>

      <div class="col-span-2">
        <app-app-textarea-component [label]="t('COMMON.DESCRIPTION')"
          [placeholder]="t('PLACEHOLDER.DESCRIPTION_LIMIT')" [control]="departmentForm.controls.description"
          [showErrors]="isFormSubmitted()" />

        <div class="p-2">
          <span class="text-xs font-medium transition-colors duration-200"
            [class]="isFormSubmitted() && isOverLimit() ? 'text-red-500' : 'text-gray-400'">
            {{ characterCount() }} / {{ descriptionCharacterLimit }} {{ t('COMMON.CHARACTERS') }}
          </span>
        </div>
      </div>
    </ng-container>

    <ng-container formActions>
      <app-form-cancel-button-component (clicked)="onCancel()" />
      <app-form-save-button-component [isLoading]="isSubmitting()" type="submit" />
    </ng-container>
  </app-form-container-component>
</div>
