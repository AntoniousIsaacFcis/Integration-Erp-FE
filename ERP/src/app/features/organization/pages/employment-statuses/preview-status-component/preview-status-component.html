<div
  class="w-full max-w-standard bg-white rounded-[20px] shadow-soft border border-black/5 p-spacing-xl flex flex-col gap-spacing-lg mx-auto"
>
  <app-form-container-component *transloco="let t" [title]="t('EMPLOYMENT_STATUS.PREVIEW')">
    <ng-container formFields [formGroup]="employmentStatusForm">
      @if (isLoading()) {
        <div class="col-span-2 flex justify-center py-10 text-gray-400">
          {{ t('COMMON.MESSAGES.LOADING_DATA') }}
        </div>
      } @else {
        <div class="col-span-2">
          <app-app-input-component
            [label]="t('EMPLOYMENT_STATUS.NAME')"
            [placeholder]="t('EMPLOYMENT_STATUS.NAME')"
            [control]="employmentStatusForm.controls.name"
          />
        </div>

        <app-app-radio-component
          [label]="t('EMPLOYMENT_STATUS.STATUS')"
          [control]="employmentStatusForm.controls.isActive"
          [options]="[
            { label: 'COMMON.ACTIVE', value: true },
            { label: 'COMMON.INACTIVE', value: false }
          ]"
        />

        <div class="col-span-2">
          <app-app-textarea-component
            [label]="t('EMPLOYMENT_STATUS.DESCRIPTION')"
            [placeholder]="t('EMPLOYMENT_STATUS.DESCRIPTION_PLACEHOLDER')"
            [control]="employmentStatusForm.controls.description"
          />

          <div class="p-2">
            <span class="text-xs font-medium text-gray-400">
              {{ characterCount() }} / {{ descriptionCharacterLimit }} {{ t('COMMON.CHARACTERS') }}
            </span>
          </div>
        </div>
      }
    </ng-container>

    <ng-container formActions>
      <app-form-save-button-component [label]="'COMMON.BACK'" (clicked)="goBack()" />
    </ng-container>
  </app-form-container-component>
</div>
