<div
  class="w-full max-w-standard bg-white rounded-[20px] shadow-soft border border-black/5 p-spacing-xl flex flex-col gap-spacing-lg mx-auto"
>
  <app-form-container-component
    *transloco="let t"
    [title]="t('JOB_LEVEL.PREVIEW_JOB_LEVEL')"
  >
    <ng-container formFields>
      @if (isLoading()) {
        <div class="col-span-2 flex justify-center py-10 text-gray-400">
          {{ t('COMMON.MESSAGES.LOADING_DATA') }}
        </div>
      } @else {
        <div class="col-span-2">
          <app-app-input-component
            [label]="t('JOB_LEVEL.JOB_LEVEL_NAME')"
            [placeholder]="t('PLACEHOLDER.ENTER_NAME')"
            [control]="jobLevelForm.controls.name"
          />
        </div>

        <app-app-input-component
          [label]="t('JOB_LEVEL.SORT_ORDER')"
          [placeholder]="t('PLACEHOLDER.ENTER_NUMBER')"
          [control]="jobLevelForm.controls.levelOrder"
          type="number"
        />

        <app-app-radio-component
          [label]="t('JOB_LEVEL.STATUS')"
          [control]="jobLevelForm.controls.isActive"
          [options]="[
            { label: 'COMMON.ACTIVE', value: true },
            { label: 'COMMON.INACTIVE', value: false }
          ]"
        />

        <div class="col-span-2">
          <app-app-textarea-component
            [label]="t('JOB_LEVEL.DESCRIPTION')"
            [placeholder]="t('PLACEHOLDER.DESCRIPTION_LIMIT')"
            [control]="jobLevelForm.controls.description"
          />

          <div class="p-2">
            <span class="text-xs font-medium text-gray-400">
              {{ wordCount() }} / 250 {{ t('COMMON.WORDS') }}
            </span>
          </div>
        </div>
      }
    </ng-container>

    <ng-container formActions>
      <app-form-save-button-component
        [label]="'COMMON.BACK'"
        (clicked)="goBack()"
      />
    </ng-container>
  </app-form-container-component>
</div>
