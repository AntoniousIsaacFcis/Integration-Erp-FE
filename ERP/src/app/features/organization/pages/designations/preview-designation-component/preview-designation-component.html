<div
  class="w-full max-w-standard bg-white rounded-[20px] shadow-soft border border-black/5 p-spacing-xl flex flex-col gap-spacing-lg mx-auto">
  <app-form-container-component *transloco="let t" [title]="t('ORGANIZATION.PREVIEW_DESIGNATION')">
    <ng-container formFields [formGroup]="designationForm">
      @if (isLoading()) {
      <div class="col-span-2 flex justify-center py-10 text-gray-400">
        {{ t('COMMON.MESSAGES.LOADING_DATA') }}
      </div>
      } @else {
      <div class="col-span-2">
        <app-app-input-component [label]="t('ORGANIZATION.DESIGNATION_NAME')"
          [placeholder]="t('PLACEHOLDER.ENTER_NAME')" [control]="designationForm.controls.name" />
      </div>

      <app-app-select-component [label]="t('EMPLOYEES.DEPARTMENT')" [control]="designationForm.controls.departmentId"
        [placeholder]="isLoadingDepartments() ? t('COMMON.LOADING') : t('PLACEHOLDER.SELECT_DEPARTMENT')">
        @for (department of departmentOptions(); track department.id) {
        <option [value]="department.id">{{ department.displayName }}</option>
        }
      </app-app-select-component>

      <app-app-radio-component [label]="t('COMMON.STATUS')" [control]="designationForm.controls.status" [options]="[
        { label: 'COMMON.ACTIVE', value: 'active' },
        { label: 'COMMON.INACTIVE', value: 'inactive' }
      ]" />

      <div class="col-span-2">
        <app-app-textarea-component [label]="t('COMMON.DESCRIPTION')"
          [placeholder]="t('PLACEHOLDER.DESCRIPTION_LIMIT')" [control]="designationForm.controls.description" />

        <div class="p-2">
          <span class="text-xs font-medium text-gray-400">
            {{ characterCount() }} / {{ descriptionCharacterLimit }} {{ t('COMMON.CHARACTERS') }}
          </span>
        </div>
      </div>
      }
    </ng-container>

    <ng-container formActions>
      <app-form-save-button-component [label]="'COMMON.BACK'" (clicked)="goBack()" />
    </ng-container>
  </app-form-container-component>
</div>
