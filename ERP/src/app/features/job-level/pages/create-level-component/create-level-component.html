<div class="w-full max-w-standard bg-white rounded-[20px] shadow-soft border border-black/5 p-spacing-xl flex flex-col gap-spacing-lg mx-auto">
  <app-form-container-component *transloco="let t" [title]="t('MENU.CREATE_LEVEL')" (submit)="onSubmit()">
    <ng-container formFields>
      <div class="col-span-2">
        <app-app-input-component [label]="t('JOB_LEVEL.JOB_LEVEL_NAME') + ' *'"
          [placeholder]="t('PLACEHOLDER.ENTER_NAME')" [control]="jobLevelForm.controls.nameAr"
          [showErrors]="isFormSubmitted()" />
      </div>

      <app-app-select-component [label]="t('TABLES.DEPARTMENT') + ' *'"
        [placeholder]="t('PLACEHOLDER.SELECT_DEPARTMENT')" [control]="jobLevelForm.controls.departmentId"
        [showErrors]="isFormSubmitted()">
        @for (dept of departments(); track dept.id) {
        <option [value]="dept.id">{{ dept.displayName }}</option>
        }
      </app-app-select-component>

      <app-app-radio-component [label]="t('COMMON.STATUS')" [required]="true" [control]="jobLevelForm.controls.status"
        [options]="[
        { label: 'COMMON.ACTIVE', value: 'active' },
        { label: 'COMMON.INACTIVE', value: 'inactive' }
      ]" />

      <div class="col-span-2">
        <app-app-textarea-component [label]="t('JOB_LEVEL.DESCRIPTION')"
          [placeholder]="t('PLACEHOLDER.DESCRIPTION_LIMIT')" [control]="jobLevelForm.controls.description" />
      </div>

    </ng-container>

    <ng-container formActions >
      <app-form-cancel-button-component (clicked)="onCancel()" />
      <app-form-save-button-component [isLoading]="isSubmitting()" [isDisabled]="jobLevelForm.invalid" type="submit" />
    </ng-container>

  </app-form-container-component>
</div>
