<div class="h-screen w-screen overflow-hidden bg-white relative flex items-center justify-center p-[15px]" *transloco="let t">

  <main class="flex flex-row w-full h-full gap-[20px] animate-scale-in">

    <section class="flex-1 flex flex-col items-center bg-white rounded-[24px] border-[4px] border-[#EDF1F1] relative text-black overflow-hidden">

      <header class="w-full max-w-[700px] h-[40px] mt-[20px] px-[24px] flex flex-row justify-between items-center shrink-0">
        <app-project-logo-component aboveColor="#000000" textColor="#000000" outlineColor="#FFFFFF" class="h-full"></app-project-logo-component>
        <app-language-switcher-component variant="toggle"></app-language-switcher-component>
      </header>

      <div class="w-full max-w-[400px] flex-1 flex flex-col justify-center gap-[20px] animate-fade-in mb-[40px]">
        <div class="text-start">
          <h2 class="text-black text-2xl font-bold tracking-tight leading-none">{{ t('AUTH.WELCOME_TITLE') }}</h2>
          <p class="text-[#909091] text-sm mt-3 font-light">{{ t('AUTH.WELCOME_SUBTITLE') }}</p>
        </div>

        <app-login-form-component></app-login-form-component>

        <app-auth-prompt-component
          message="AUTH.NO_ACCOUNT"
          actionText="AUTH.JOINUS"
          route="/auth/register"
          linkColor="text-[#196FEB]"
          class="text-sm">
        </app-auth-prompt-component>
      </div>

      <footer class="absolute bottom-[6px] text-[12px] font-light text-[#909091] tracking-wide shrink-0 ">
        {{ t('AUTH.COPYRIGHT') }}
      </footer>
    </section>

    <section class="hidden lg:flex flex-1 flex-col relative rounded-[24px] overflow-hidden bg-[#196FEB]">
      <div class="absolute inset-0 z-0 pointer-events-none">
        <img ngSrc="assets/imgs/loginBackground.png" priority fill class="object-cover mix-blend-overlay" alt="Background Pattern" />
      </div>

      <div class="relative z-10 w-full max-w-[450px] mx-auto mt-[40px] px-6">
        <h1 class="text-white text-[24px] font-semibold leading-tight text-center">
          {{ t('AUTH.SLOGAN') }}
        </h1>
        <div class="flex gap-1.5 justify-center mt-[16px]">
          <span class="w-6 h-1.5 rounded-full bg-white"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-white/40"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-white/40"></span>
        </div>
      </div>

      <div class="absolute bottom-[-20px] start-[80px] w-[95%] h-[75%] rounded-[12px] border-[8px] border-white/10 overflow-hidden shadow-2xl ">
        <img ngSrc="assets/imgs/login-illustration.png" fill priority alt="Dashboard Preview" class="object-cover object-top" />
      </div>
    </section>

  </main>
</div>
