<ng-container *transloco="let t">
  <div class="flex items-center justify-center
              w-[152px] h-[39px]
              border border-[#333333] rounded-[8px]
               cursor-pointer
              hover-lift hover:shadow-sm transition-all duration-200">

    <div class="flex justify-between items-center w-[123px] h-[23px] gap-[15px]">

      <div class="flex items-center gap-[8px]">
        <div class="w-[21px] h-[21px] flex shrink-0 overflow-hidden rounded-full border border-gray-100">
          <img ngSrc="assets/imgs/arabiaSaudiaFlag.png" priority width="21" height="21" alt="Flag" class="object-cover" />
        </div>

        <span class="w-[66px] h-[23px] flex items-center justify-center
                     text-[15px] font-[400] leading-none
                     text-[#FFFFFF] font-arabic whitespace-nowrap">
          {{ t('HEADER.LANGUAGE')}}
        </span>
      </div>

      <div class="flex items-center justify-center w-[15px] h-[8px]">
        <ng-icon name="lucideChevronDown" size="15" color="#999999" strokeWidth="3">
        </ng-icon>
      </div>

    </div>
  </div>
</ng-container>
