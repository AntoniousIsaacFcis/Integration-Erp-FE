<div [class]="cardClasses()" *transloco="let t">

  <div class="flex flex-col items-start text-end leading-tight">
    <span class="text-xs font-bold text-black">{{ dayNumber() }}</span>
    <span class="text-xs font-semibold text-black">{{ t(dayName()) }}</span>
  </div>

  <div class="flex flex-col items-end gap-1 w-full mt-2">
    @if (isWorkDay() && (checkIn() || checkOut())) {
    <div class="flex items-center justify-end gap-1.5">
      <ng-icon name="lucideLogIn" size="13" color="#E02D2D" class="flex-shrink-0" />
      <span class="text-xs font-normal text-[#797979]">{{ checkIn() || '--:--' }}</span>
    </div>

    <div class="flex items-center justify-end gap-1.5">
      <ng-icon name="lucideLogIn" size="13" color="#03BE00" class="rotate-180 flex-shrink-0" />
      <span class="text-xs font-normal text-[#797979]">{{ checkOut() || '--:--' }}</span>
    </div>
    } @else {
    <span class="text-xs font-normal text-[#797979] text-center w-full block py-1">
      {{ t(statusText()) }}
    </span>
    }
  </div>
</div>
