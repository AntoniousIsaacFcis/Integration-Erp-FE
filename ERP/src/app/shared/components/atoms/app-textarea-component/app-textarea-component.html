<div class="flex flex-col w-full gap-[12px] font-arabic" *transloco="let t">
  @if (label()) {
    <label class="text-base font-medium leading-none text-start text-black">
      {{ t(label()) }}
    </label>
  }
  <textarea [formControl]="control()"
    [placeholder]="t(placeholder())"
    class="w-full min-h-[120px] p-md bg-white border border-[#0000001A] rounded-md outline-none transition-all text-sm text-start text-black placeholder:text-black/20 placeholder:font-normal focus:border-primary  focus:ring-1 focus:ring-primary/20">
  </textarea>
</div>
