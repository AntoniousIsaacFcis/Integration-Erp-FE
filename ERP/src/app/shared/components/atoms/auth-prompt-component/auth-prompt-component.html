<div
      class="flex items-center justify-center font-bold gap-xs mt-spacing-md animate-fade-in"
      *transloco="let t"
    >
      <span class="text-md font-arabic font-medium text-[#909091]">
        {{ t(message()) }}
      </span>

      <a
        [routerLink]="[route()]"
        routerLinkActive="underline"
        [class]="linkColor()"
        class=" text-md font-medium  hover:underline transition-fast "
      >
        {{ t(actionText()) }}
      </a>
    </div>
