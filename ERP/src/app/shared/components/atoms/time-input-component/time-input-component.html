<div class="flex flex-col w-full gap-[12px] font-arabic" *transloco="let t">
  @if (label()) {
  <label class="text-base font-medium leading-none text-start text-black">
    {{ t(label()) }} <span class="text-red-500 ms-1" aria-hidden="true">*</span>
  </label>
  }

  <div class="relative w-full group">
    <input #timeInput type="time" [formControl]="control()" [readOnly]="readonly()" [class.has-value]="control().value"
      [class.!border-error]="showErrors() && control().invalid" [class.!border-2]="showErrors() && control().invalid"
      class="custom-time-input w-full h-[44px] px-md pe-10 bg-white border border-[#0000001A] rounded-md outline-none transition-all text-end text-sm font-normal text-black appearance-none focus:border-primary focus:ring-1 focus:ring-primary/20 cursor-pointer disabled:cursor-not-allowed disabled:bg-gray-50 disabled:text-black/70 disabled:opacity-70 read-only:cursor-not-allowed read-only:bg-gray-50 read-only:text-black/70" />

    @if (!control().value) {
    <span class="absolute inset-y-0 start-md flex items-center pointer-events-none text-black/20 text-md font-normal">
      {{`${placeHodler()} ${ t('COMMON.TIME_SUFFIX')}` }}
    </span>
    }

    <div (click)="openPicker(timeInput)"
      class="absolute inset-y-0 end-[14px] flex items-center cursor-pointer text-black/40 group-focus-within:text-primary transition-colors"
      [class.cursor-not-allowed]="control().disabled || readonly()">
      <ng-icon name="lucideClock" size="18"></ng-icon>
    </div>
  </div>

  @if (errorKey; as key) {
  <div class="flex items-center gap-xs text-error animate-fade-in">
    <ng-icon name="lucideOctagonX" size="16" strokeWidth="3"></ng-icon>
    <span class="text-xs font-medium text-start">
      {{ t(key) }}
    </span>
  </div>
  }
</div>
