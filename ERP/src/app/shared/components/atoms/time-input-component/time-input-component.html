<div class="flex flex-col gap-2 w-full">
  <label class="text-sm font-bold text-black/70">
    {{ label() }} <span class="text-red-500">*</span>
  </label>
  <div class="relative group">
    <input type="time" [formControl]="control()" class="w-full h-[50px] px-4 pr-12 bg-white border border-black/5 rounded-[12px]
                 focus:outline-none focus:border-primary/30 transition-all text-sm text-black/60 shadow-sm
                 group-hover:border-black/10" />
    <div class="absolute right-4 top-1/2 -translate-y-1/2 opacity-40 group-focus-within:text-primary transition-colors">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
  </div>
</div>
