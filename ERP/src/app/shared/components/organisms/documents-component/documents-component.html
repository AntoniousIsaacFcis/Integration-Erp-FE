<div class="my-4" *transloco="let t">
  <div
    (dragover)="$event.preventDefault()"
    (drop)="onFileDropped($event)"
    class="relative border-2 border-dashed border-black/10 rounded-[12px] h-[190px] flex flex-col items-center justify-center bg-[#FBFBFB] hover:bg-slate-50 transition-colors cursor-pointer group"
    (click)="fileInput.click()"
  >
    <input #fileInput type="file" multiple class="hidden" (change)="onFileSelected($event)">

    <div class="w-[73px] h-[73.001px] flex-center mb-2">
      <img src="assets/imgs/upload-icon.png" alt="upload" class="w-full h-full object-contain">
    </div>

    <div class=" flex items-center justify-center">
      <span class="font-arabic font-semibold text-base leading-none text-black text-right">
        {{ t('DOCUMENTS.UPLOAD_TEXT') || 'اضغط لرفع الملفات' }}
      </span>
    </div>
  </div>

  @if (files().length > 0) {
    <div class="space-y-2 animate-fade-in">
      @for (doc of files(); track $index) {
        <div class="flex items-center justify-between p-2 bg-white border border-slate-100 rounded-lg hover:shadow-sm transition-all group">

          <div class="flex items-center gap-4 flex-1">
            <div class="w-14 h-14 rounded-md bg-slate-100 overflow-hidden border border-slate-200 flex items-center justify-center">
              @if (getPreviewUrl(doc)) {
                <img [src]="getPreviewUrl(doc)" class="w-full h-full object-cover">
              } @else {
                <ng-icon name="lucideFileText" size="24" color="#8BC32F" ></ng-icon>
              }
            </div>

            <div class="flex flex-col">
              <span class="text-sm font-bold text-slate-700 truncate max-w-[300px]" [title]="doc.name">
                {{ doc.name }}
              </span>
              <span class="text-[11px] text-slate-400 font-medium">
                {{ (doc.size / (1024 * 1024)).toFixed(2) }} MB
              </span>
            </div>
          </div>

          <div class="flex items-center gap-1">
            <button type="button" (click)="downloadFile(doc)" class="p-2 text-slate-400 hover:text-primary hover:bg-slate-50 rounded-md transition-all" [title]="t('COMMON.DOWNLOAD')">
              <ng-icon name="lucideDownload" size="18"></ng-icon>
            </button>

            <button type="button" (click)="updateFile($index)" class="p-2 text-slate-400 hover:text-amber-500 hover:bg-slate-50 rounded-md transition-all" [title]="t('COMMON.UPDATE')">
              <ng-icon name="lucideRefreshCcw" size="18"></ng-icon>
            </button>

            <button type="button" (click)="removeFile($index)" class="p-2 text-slate-400 hover:text-error hover:bg-error/5 rounded-md transition-all" [title]="t('COMMON.DELETE')">
              <ng-icon name="lucideTrash2" size="18"></ng-icon>
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
